name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

env:
  BOT_TOKEN: "123456:TEST_TOKEN"
  TEST_BOT_TOKEN: "123456:TEST_TOKEN"
  BASE_FEE: "100"
  DB_URL: "sqlite+aiosqlite:///tmp/mmwb-test.db"
  REDIS_URL: "redis://localhost:6379/0"
  TRON_API_KEY: "test"
  TRON_MASTER_ADDRESS: "test"
  TRON_MASTER_KEY: "test"
  THOTHPAY_API: "test"
  OPENAI_KEY: "test"
  EURMTL_KEY: "test"
  SENTRY_DSN: "https://examplePublicKey@o0.ingest.sentry.io/0"
  HORIZON_URL: "https://horizon-testnet.stellar.org"
  HORIZON_URL_RW: "https://horizon-testnet.stellar.org"
  MONGODB_URL: "mongodb://localhost:27017/mmwb_test"
  GRIST_TOKEN: "test"
  TONCONSOLE_TOKEN: "test"
  TON_TOKEN: "test"
  WALLET_COST: "1"
jobs:
  secrets-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run gitleaks
        uses: docker://zricethezav/gitleaks:v8.24.2
        with:
          args: detect --source=. --no-git --redact --config=.gitleaks.toml

  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Setup just
        uses: taiki-e/install-action@just

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libzbar0

      - name: Run CI gate
        run: just check-fast

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Setup just
        uses: taiki-e/install-action@just

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libzbar0

      - name: Run E2E smoke gate
        run: just test-e2e-smoke

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - secrets-scan
      - check
      - e2e-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-latest-${{ matrix.name }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bot
            file: Dockerfile
            image: ghcr.io/attid/mmwb:latest
            cache_scope: mmwb-bot
          - name: webapp
            file: Dockerfile.webapp
            image: ghcr.io/attid/mmwb-webapp:latest
            cache_scope: mmwb-webapp

    name: Publish ${{ matrix.name }} image
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set image revision
        run: echo "GIT_COMMIT=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ${{ matrix.image }}
          build-args: |
            GIT_COMMIT=${{ env.GIT_COMMIT }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
